name: One-time Vite and dependency remediation

on:
  push:
    branches:
      - 'remediate/lnasf-audit-vite-20261010'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: remediate/lnasf-audit-vite-20261010
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install current Vite, Vitest, and ESLint toolchain
        run: npm install --save-dev vite@latest @vitejs/plugin-react@latest vitest@latest jsdom@latest eslint@^9 @eslint/js@latest eslint-plugin-react@latest eslint-plugin-react-hooks@latest globals@latest --no-fund

      - name: Apply non-breaking audit remediations
        run: npm audit fix --no-fund || echo "Some advisories need separate review; no force upgrade will be applied."

      - name: Verify clean lockfile installation
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Record remaining audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/npm-audit.json","utf8")); console.log("NPM_AUDIT_SUMMARY="+JSON.stringify(r.metadata?.vulnerabilities ?? {}));'

      - name: Commit tested dependency lock and remove temporary workflow
        env:
          BRANCH_NAME: remediate/lnasf-audit-vite-20261010
        run: |
          rm .github/workflows/remediate-vite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build: migrate React client to Vite and remediate dependencies"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
